version: "3"

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - 27017:27017
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
    restart: unless-stopped

  ist-site:
    image: ghcr.io/navatusein/ist-site:dev-latest
    container_name: ist-site
    ports:
      - 80:80
    volumes:
      - ist-public-files:/app/public/files
    environment:
      - MONGODB_URI=mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongodb/ist
      - NEXT_PUBLIC_BASE_URL=${PUBLIC_URL}
      - SECRET=${SECRET}
    restart: unless-stopped

volumes:
  mongodb-data:
  ist-public-files: