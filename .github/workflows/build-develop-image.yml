name: Build Develop Image

on:
  push:
    branches:
      - "develop"
    paths-ignore:
      - "**.md"
      - ".github/workflows/check.yml"
      - ".github/workflows/build-release-image.yml"
  workflow_dispatch:

concurrency:
  group: build-develop-image
  cancel-in-progress: true

jobs:
  image:
    name: Image
    uses: ./.github/workflows/build-image.yml
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    with:
      tags: |
        type=sha,prefix=dev-
        type=raw,value=dev-latest
